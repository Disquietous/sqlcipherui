name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Find successful build run
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_INFO=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow=release.yml --status=success --limit=1 \
            --json databaseId,headSha -q '.[0] | "\(.databaseId) \(.headSha)"')
          if [ -z "$RUN_INFO" ]; then
            echo "ERROR: No successful build found. Run the build workflow first."
            exit 1
          fi
          RUN_ID=${RUN_INFO% *}
          RUN_SHA=${RUN_INFO#* }
          if [ "$RUN_SHA" != "$GITHUB_SHA" ]; then
            echo "ERROR: Latest successful build (run $RUN_ID) is from $RUN_SHA,"
            echo "       but tag $GITHUB_REF_NAME points at $GITHUB_SHA."
            echo "Build the tagged commit first, then re-push the tag."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using build run: $RUN_ID ($RUN_SHA)"

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh run download "${{ steps.find-run.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" --dir artifacts

      - name: Collect installer files
        id: collect
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \) \
            -exec cp {} release-assets/ \;
          ls -lh release-assets/
          COUNT=$(find release-assets -type f | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No installer files found in build artifacts."
            exit 1
          fi
          echo "Found $COUNT installer(s)"

          VERSION="${GITHUB_REF_NAME#v}"
          for f in release-assets/*; do
            case "$(basename "$f")" in
              *"_${VERSION}_"*) ;;
              *)
                echo "ERROR: $(basename "$f") does not match tag version ${VERSION}."
                echo "The build was made at a different version than the tag."
                exit 1
                ;;
            esac
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Release $TAG exists. Replacing assets."
            for asset in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                --json assets -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "SQLCipherUI ${TAG}" \
              --generate-notes
          fi
